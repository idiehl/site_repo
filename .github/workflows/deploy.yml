name: Main Site CI

on:
  push:
    branches: ["master"]
    paths:
      - "src/Atlas.Web/**"
      - "tests/Atlas.Web.Tests/**"
      - "AtlasUniversalis.sln"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "src/Atlas.Web/**"
      - "tests/Atlas.Web.Tests/**"
      - "AtlasUniversalis.sln"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AtlasUniversalis.sln

      - name: Build
        run: dotnet build AtlasUniversalis.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AtlasUniversalis.sln --configuration Release --no-build --verbosity normal
